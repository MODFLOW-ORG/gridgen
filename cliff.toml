# git-cliff configuration for the changelog on each GitHub release (pixi run changelog)
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
* {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}\
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# link the pull request a squash merge names, e.g. (#155)
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/MODFLOW-ORG/gridgen/pull/${1}))" },
]
# only changes to gridgen itself; build, chore, ci, docs, style, test, and revert are left out
commit_parsers = [
  { message = '^feat(\(.*\))?!?:', group = "<!-- 0 -->New features" },
  { message = '^fix(\(.*\))?!?:', group = "<!-- 1 -->Fixes" },
  { message = '^perf(\(.*\))?!?:', group = "<!-- 2 -->Performance" },
  { message = '^refactor(\(.*\))?!?:', group = "<!-- 3 -->Refactoring" },
  { message = ".*", skip = true },
]
filter_commits = true
# release tags are v1.0.03 and, before it, 1.0.02; latest_build is not a release
tag_pattern = "^v?[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "oldest"
