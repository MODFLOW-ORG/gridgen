section = "fixes"
subsection = "gridding"
description = "A quadtree grid built with NODE_NUMBERING = zero-based wrote a tree structure file that later actions could not read. The file now gives each cell's layer, row, and column starting at 1 and its quadrant numbers from 1 to 4, as the GRIDGEN report describes, so it can be read back, and a grid read from it keeps zero-based node numbers in all exported files. A zero-based tree structure file written by an earlier version still stops GRIDGEN; rebuild the grid. Output for grids built with the default one-based numbering is unchanged."
