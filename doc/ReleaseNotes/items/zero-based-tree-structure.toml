section = "fixes"
subsection = "gridding"
description = "A quadtree grid built with NODE_NUMBERING = zero-based wrote a tree structure file that later actions could not read. The file now uses the one-based (layer, row, column) identifiers and quadrant numbers 1 to 4 described in the GRIDGEN report, whatever the node numbering, and a grid read from it keeps zero-based numbering in all exported files. A zero-based tree structure file written by an earlier version still cannot be read; rebuild the grid. Output for grids built with the default one-based numbering is unchanged."
