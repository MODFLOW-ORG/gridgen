section = "fixes"
subsection = "gridding"
description = "Cell elevations read with the ASCIIGRID option included NODATA values in the area-weighted average, so a cell partly over missing data was given an elevation pulled toward the NODATA value (for example, about -2,500 instead of -42 for a cell one quarter over a -9999 value). Missing data are now left out of the average. A cell that lies entirely over NODATA values has no elevation to interpolate from, and GRIDGEN now stops with an error naming the ASCII grid and the cell location instead of writing the NODATA value as an elevation."
