section = "fixes"
subsection = "export"
description = "GRID_TO_USGDATA now writes correct unstructured grid arrays for a MODFLOW_GRID, which the GRIDGEN report documents only for a QUADTREE grid. Previously, horizontal connection areas were calculated from layer thicknesses truncated to whole numbers and, for connections to the next column or row, from the thickness of the wrong cell; upward connections had the direction of a downward connection; the last value of the ia array and the number of connections in the node file were wrong; and GRIDGEN stopped before writing the node file. Output for quadtree grids is unchanged."
