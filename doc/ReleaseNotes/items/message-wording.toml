section = "fixes"
subsection = "input"
description = "Error and warning messages now name the block, record, or file they concern in the terms of the definition file, rather than the program function that reports them; for example, a missing record is reported as \"MODFLOW_GRID block mfg has no NROW record\", and a block that names an undefined block, or one of the wrong type, is reported with the record that names it. GRIDGEN now stops with an error when a QUADTREE structure file has a quadrant code other than 1 to 4, when the first part of a shapefile shape does not start at its first vertex, and when a feature has a coordinate that is not a number; previously, it printed a message and continued. Output for valid input is unchanged."
