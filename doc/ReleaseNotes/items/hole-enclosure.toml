section = "fixes"
subsection = "intersection"
description = "A GRID_INTERSECTION with FEATURE_TYPE = polygon could list part of a hole in a cell as a separate piece of the polygon, adding its area to the cell instead of subtracting it, when an edge of the outer boundary spanned a very small angle as seen from the hole. The hole is now subtracted, and each cell is listed with the area of the polygon outside the hole."
