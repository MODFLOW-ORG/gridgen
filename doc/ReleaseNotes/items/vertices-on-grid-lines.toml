section = "fixes"
subsection = "intersection"
description = "A GRID_INTERSECTION with FEATURE_TYPE = polygon could stop with an error, or report incorrect areas that changed from run to run, when vertices of the polygon or of one of its holes lay exactly on grid lines, including an edge along a grid line and vertices that lie on a grid line of a rotated grid only to within rounding. The intersection now completes with the correct areas, and gives the same result every run. Intersections with polygons whose vertices are not on grid lines are unchanged."
