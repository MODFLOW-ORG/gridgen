section = "internal"
subsection = "build"
description = "The continuous integration builds with gcc on Linux and Windows, the build with checks for invalid memory use and undefined behavior, and the MODFLOW-USG and MODFLOW 6 model checks now install gcc 15 from conda-forge, in place of gcc 13 from operating-system package sources that were sometimes unavailable. The released executables, built with Intel compilers on Linux and Windows and with gcc 13 on macOS, are unchanged."
