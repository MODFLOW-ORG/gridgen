section = "internal"
subsection = "build"
description = "The continuous integration builds with gcc on Linux and Windows, the build with checks for invalid memory use and undefined behavior, and the MODFLOW-USG and MODFLOW 6 model checks now install gcc 15 from conda-forge, in place of gcc 13 from operating-system package sources that were sometimes unavailable. The macOS executable is now built with gcc 15 from Homebrew, in place of gcc 13; the Linux and Windows executables are still built with Intel compilers."
