section = "fixes"
subsection = "input"
description = "The record names REFINE_LEVEL_BY_ATTRIBUTE, HORIZONTAL_SMOOTHING_LEVEL, and VERTICAL_SMOOTHING_LEVEL given in the GRIDGEN report are now accepted. Previously, the first stopped GRIDGEN and the others were ignored, so smoothing stayed at level 1. The spellings GRIDGEN accepted before, REFINEMENT_LEVEL_BY_ATTRIBUTE, SMOOTHING_LEVEL_HORIZONTAL, and SMOOTHING_LEVEL_VERTICAL, are still accepted, and the report's spelling is used if both are given. A refinement level read from a shapefile attribute now overrides REFINEMENT_LEVEL, as the report describes; previously REFINEMENT_LEVEL was used when both were given. GRIDGEN now prints a warning for each record it does not recognize in a block, such as a misspelled name, instead of ignoring it."
