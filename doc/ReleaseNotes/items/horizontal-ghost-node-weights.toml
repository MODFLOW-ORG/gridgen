section = "fixes"
subsection = "export"
description = "Some horizontal ghost nodes in the .gnc.dat file did not reproduce a head that varies linearly, so the flow between the two connected cells was slightly in error: those interpolated from a single cell larger than the cell that contains the ghost node and offset along the connection, and those along the edge of an active domain or of the grid, where the cells beside the cell that contains the ghost node are inactive, missing, or coarser. Such a ghost node is now interpolated from active cells nearby, with contributing factors that are not negative. In a test grid with active domains in two layers, the 1,690 of 25,598 ghost nodes that did not reproduce such a head now do, and 45 more connections have a ghost node. Where the head cannot be interpolated from the active cells nearby, the ghost node is missing or written as before, and GRIDGEN warns with the number of such connections."
