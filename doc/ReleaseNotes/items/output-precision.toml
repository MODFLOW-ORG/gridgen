section = "fixes"
subsection = "export"
description = "Real values in several output files were written with too few digits. VTK files with shared vertices stored coordinates and cell values in single precision, and all VTK files wrote six significant digits (2.86978e+06 for a northing, or 10-meter resolution); connection lengths and areas (the c1, c2, and fahl files) were stored in single precision; array files were written with 10 significant digits; and ghost-node coefficients and intersection (.ifo) values were written with six. The .nod file and the grid definition file used 40 digits, which writes digits that do not represent the stored value. Each real value is now stored in double precision and written with the fewest digits, up to 17, that read back to the same value."
