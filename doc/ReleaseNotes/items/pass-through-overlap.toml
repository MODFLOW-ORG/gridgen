section = "fixes"
subsection = "export"
description = "With VERTICAL_PASS_THROUGH = True, a cell above or below an inactive cell that is larger than it was also connected to the active cells on the other side of the inactive cell that are not below or above it, each over the area of the smallest cell in the column. These connections are no longer written; the other connections, their flow areas, and the vertical ghost nodes are unchanged."
