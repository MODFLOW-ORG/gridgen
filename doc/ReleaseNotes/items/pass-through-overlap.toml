section = "fixes"
subsection = "export"
description = "With VERTICAL_PASS_THROUGH = True, a cell above or below an inactive cell that is larger than it was also connected to the active cells on the other side of the inactive cell that are not below or above it, each over the area of the smallest cell in the column, and a connection to a cell that is below or above it could be given its flow area more than once. A cell is now connected only to the cells below or above it, over the area they share through the inactive cells."
