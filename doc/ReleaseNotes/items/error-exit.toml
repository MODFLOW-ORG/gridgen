section = "fixes"
subsection = ""
description = "GRIDGEN now stops with an error message and an exit code of 1 when the definition file is missing a required record, such as NROW, or names an array or ESRI ASCII grid file that cannot be read. Previously, a missing record or an unreadable ESRI ASCII grid stopped the program with an assertion failure, and an array file that could not be opened did not stop the run. Output for valid input is unchanged."
