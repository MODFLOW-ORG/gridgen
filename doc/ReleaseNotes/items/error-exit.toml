section = "fixes"
subsection = ""
description = "GRIDGEN now stops with an error message and an exit code of 1 when the definition file is missing a required record, such as NROW, names an array file that cannot be opened or an ESRI ASCII grid that cannot be read, or when ghost nodes cannot be computed. Previously, a missing record or an unreadable ESRI ASCII grid stopped the program with an assertion failure, an array file that could not be opened did not stop the run, and a ghost node error ended the run with an exit code of 0, as if it had succeeded. Output for valid input is unchanged."
