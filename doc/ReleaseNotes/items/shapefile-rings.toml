section = "fixes"
subsection = "intersection"
description = "The OUTPUT_SHAPEFILE of a GRID_INTERSECTION with FEATURE_TYPE = polygon wrote the outer boundary of each polygon counterclockwise and its holes clockwise, the reverse of the shapefile specification, and did not repeat the first vertex at the end of each boundary. GIS programs warned of unclosed rings and read a cell that contains a whole hole as invalid, with a negative area. The boundaries are now written in the order the specification requires and closed, and the areas in OUTPUT_FILE are unchanged."
