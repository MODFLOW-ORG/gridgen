section = "features"
subsection = "export"
description = "A GRID_TO_USGDATA block also writes the MODFLOW 6 DISU arrays IHC, HWVA, and ANGLDEGX and the MODFLOW-USG DISU array IVC, so that both programs can read the connection type, face width, and face angle directly instead of computing them from the connection direction and area. ANGLDEGX includes the rotation of the grid. They are described in the Tips and Recommendations section."
