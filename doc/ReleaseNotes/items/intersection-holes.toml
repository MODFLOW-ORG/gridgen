section = "fixes"
subsection = "intersection"
description = "A GRID_INTERSECTION with a polygon that has a hole counted the hole as part of the polygon: cells inside the hole were listed with their full area, and cells crossing the edge of the hole were listed twice, once with the area outside the hole and once with the area inside it. Cells inside the hole are no longer listed, and each cell is listed once with the area of the polygon outside the hole. Intersections with polygons without holes are unchanged."
