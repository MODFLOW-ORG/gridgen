section = "fixes"
subsection = "input"
description = "Multipatch shapefiles were read incorrectly, so an active domain or refinement feature from a multipatch shapefile could lose its polygons or its holes; an active domain of outer and inner rings made the whole layer inactive. Outer and first rings now start a polygon and inner rings are its holes; a plain ring starts a polygon unless it follows another ring, when it is a hole, as in a polygon shapefile. Triangle strips and fans are skipped with a warning."
