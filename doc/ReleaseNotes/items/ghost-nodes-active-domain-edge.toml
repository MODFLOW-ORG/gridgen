section = "fixes"
subsection = "export"
description = "Along the edge of an active domain or of the grid, more ghost nodes in the .gnc.dat file reproduce a head that varies linearly: where the neighbors of the cell that contains a ghost node do not allow it, the ghost node is now interpolated from the smaller cell of the connection or from a cell beyond one of those neighbors. In a test grid with active domains in two layers, the 43 horizontal ghost nodes that were interpolated from a single larger neighbor now reproduce such a head, and 45 more connections have a ghost node. Where the head could be found only by projecting it beyond the active cells, the ghost node is written as before, and GRIDGEN warns with the number of such connections at the edge of an active domain."
