section = "fixes"
subsection = "export"
description = "Along the edge of an active domain or of the grid, more ghost nodes in the .gnc.dat file reproduce a head that varies linearly. Where the cells beside the cell that contains a ghost node are inactive, missing, or coarser, the head at the ghost node is now interpolated from other active cells nearby, with contributing factors that are not negative. In a test grid with active domains in two layers, the 43 horizontal ghost nodes that were interpolated from a single larger neighbor now reproduce such a head, and 45 more connections have a ghost node. Where the head cannot be interpolated from the active cells nearby, the ghost node is written as before, and GRIDGEN warns with the number of such connections from a cell next to an inactive cell."
