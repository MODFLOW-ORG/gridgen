section = "internal"
subsection = "build"
description = "Test cases were added for elevations from ASCII grids, omitted and aligned elevations, a single smoothing level, active domains defined by lines, points, and the interior of a polygon, an active domain and refinement from a polygon with a hole, unshared-vertex VTK files, zero-based and line shapefiles, and intersections of a MODFLOW_GRID, and logical attributes in intersection output. `pixi run coverage` reports how much of the source code the test cases run. The program and its output are unchanged."
