section = "features"
subsection = "export"
description = "A GRID_TO_USGDATA block with the new record GNC_VERTICAL = True also writes ghost nodes for the vertical connections between a cell and the smaller cells above or below it, which correct the flow between layers with different refinement. The ghost nodes are added to the .gnc.dat file after the horizontal ones, in the same format, and are described in the Tips and Recommendations section. The default output is unchanged."
