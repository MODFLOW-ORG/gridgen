section = "fixes"
subsection = "input"
description = "GRIDGEN now warns when a shapefile feature named in a REFINEMENT_FEATURES, ACTIVE_DOMAIN, or GRID_INTERSECTION block does not intersect the grid, when a shapefile has no features of its FEATURE_TYPE, and when a GRID_INTERSECTION block writes no output because nothing intersects the grid. Previously, these features were ignored without a message. GRIDGEN now stops with an error when a shapefile cannot be opened, when the field named by REFINEMENT_LEVEL_BY_ATTRIBUTE is not in the shapefile, when FEATURE_TYPE is not line, polygon, or point, when an OPEN/CLOSE array file has fewer numbers than the array, when a record has no value, when a block ends with a different type than it began, and when a definition file or output file cannot be opened. Previously, most of these printed a message and continued without the input, or left array values undefined. FEATURE_TYPE is no longer case sensitive in ACTIVE_DOMAIN and GRID_INTERSECTION blocks, and a shapefile with no attribute fields is now read; previously, its features were ignored."
