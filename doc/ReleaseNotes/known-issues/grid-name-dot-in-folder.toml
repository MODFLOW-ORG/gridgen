issue = 184
description = "When GRID_DEFINITION_FILE names a file without an extension in a folder whose name contains a period, such as out.v2/grid02qtg, the grid is named for the part of the folder name before the period (out), and its tree structure file and its top and bottom arrays are written with that name to the folder GRIDGEN is run from rather than beside the grid definition file. The grid definition file still names them correctly and can be read with LOAD, but a later GRID record must use the truncated name. Give the grid definition file an extension, such as .dfn, or use a folder name without a period."
