issue = 184
description = "When GRID_DEFINITION_FILE names a file without an extension and its path has a period before the file name, as in out.v2/grid02qtg or ../grid02qtg, the grid is named for the part of the path before the last period (out, or .), and its tree structure file and its top and bottom arrays are written with that name relative to the folder GRIDGEN is run from (out.tsf, or ..tsf) rather than beside the grid definition file. The grid definition file still names them correctly and can be read with LOAD, but a later GRID record must use that name. Give the grid definition file an extension, such as .dfn."
