issue = 170
description = "Along the edge of an active domain, the head at some ghost nodes in the .gnc.dat file cannot be interpolated from the active cells nearby without a negative contributing factor, so these ghost nodes are missing or, with GNC_VERTICAL = True, interpolated in only one of the x and y directions. The flow between the two connected cells is then in error where the head varies along the edge, and GRIDGEN warns with the number of such connections in each GRID_TO_USGDATA block. In MODFLOW-USG and MODFLOW 6 tests of a three-layer grid with an active domain in the middle layer, GNC_VERTICAL = True, and heads that vary linearly over 86 length units, specified in the cells along the edges of the grid and of the active domain, these ghost nodes gave a largest head error of 0.044 length units; with the heads in the cells next to those edges specified too, the largest error was less than 0.00001 length units. Refining the cells along the edge of an active domain to the size of their neighbors avoids this, and in MODFLOW 6 the XT3D option of the NPF Package can be used in place of ghost nodes."
