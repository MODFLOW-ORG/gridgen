issue = 170
description = "Along the edge of an active domain, some ghost nodes in the .gnc.dat file do not reproduce a head that varies linearly, because a neighbor they would be interpolated from is inactive. A horizontal ghost node is either missing or interpolated from a single neighbor that is larger than the cell that contains the ghost node, with a center that is offset from that cell's center in the direction of the connection. With GNC_VERTICAL = True, a vertical ghost node is interpolated in only one of the x and y directions, or is missing where both neighbors are inactive. The flow between the two connected cells is then in error where the head varies across the connection. In a test grid with active domains in two layers, 43 of the 25,598 horizontal ghost nodes were interpolated from a single larger neighbor in this way. In MODFLOW 6 and MODFLOW-USG tests of a different, three-layer grid with an active domain in the middle layer, GNC_VERTICAL = True, and heads that vary linearly over 86 length units, specified in the cells along the edges of the grid and of the active domain, the missing and inexact ghost nodes at the edge of the active domain gave a largest head error of 0.044 length units. With the heads in the cells next to those edges specified too, the largest error was less than 0.00001 length units."
