issue = 188
description = "GIS software reads the integer fields of the shapefiles GRIDGEN writes as double-precision fields, so another table cannot be joined to them on one of these fields. They are the nodenumber, layer, row, and col fields of a GRID_TO_SHAPEFILE block (layer only for a line shapefile), and the nodenumber field, the pointid, arcid, or polyid field, and any integer attribute copied from the input shapefile in the OUTPUT_SHAPEFILE of a GRID_INTERSECTION block. Copy the values to a new integer field in the GIS, for example with a field calculator, before joining."
