name: gridgen checks
on:
  # run at 6 AM UTC every day
  schedule:
    - cron: '0 6 * * *' 
  push:
    # skip changes that cannot affect the build or tests
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - 'LICENSE'
      - 'ruff.toml'
      - '.codespellrc'
      - '.clang-format'
      - '.clang-tidy'
      - 'cliff.toml'
      - '.clangd'
      - '.git-blame-ignore-revs'
      - '.github/workflows/lint.yml'
      - '.github/workflows/check-models.yml'
  pull_request:
    # labeled and unlabeled so the output-change label takes effect
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - 'LICENSE'
      - 'ruff.toml'
      - '.codespellrc'
      - '.clang-format'
      - '.clang-tidy'
      - 'cliff.toml'
      - '.clangd'
      - '.git-blame-ignore-revs'
      - '.github/workflows/lint.yml'
      - '.github/workflows/check-models.yml'
  workflow_dispatch:
# a label other than output-change runs nothing, so its run gets a group of
# its own and cannot cancel the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && github.event.label.name != 'output-change' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true
env:
  PIXI_BETA_WARNING_OFF: true
  DIST: dist-path
  PROGRAM_NAME: gridgen
jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.version }}
    if: ${{ !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || github.event.label.name == 'output-change' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # gcc
          - {os: ubuntu-22.04, compiler: gcc, version: 13, shell: bash, release: no}
          - {os: macos-15, compiler: gcc, version: 13, shell: bash, release: yes, xcode-version: '16.4'}
          - {os: windows-2022, compiler: gcc, version: 13, shell: pwsh, release: no}
          # clang (Apple clang from Xcode)
          - {os: macos-15, compiler: clang, version: 17, shell: bash, release: no, xcode-version: '16.4'}
          # intel
          - {os: ubuntu-22.04, compiler: intel-classic, version: 2021.7, shell: bash, release: no}
          - {os: ubuntu-22.04, compiler: intel, version: "2025.0", shell: bash, release: yes}
          - {os: windows-2022, compiler: intel, version: "2025.0", shell: pwsh, release: yes}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout ${{ env.PROGRAM_NAME }}
        uses: actions/checkout@v5
        with:
          path: ${{ env.PROGRAM_NAME }}

      - name: Setup ${{ matrix.compiler }} ${{ matrix.version }} on ${{ matrix.os }}
        if: matrix.compiler != 'clang'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler}}
          version: ${{ matrix.version }}

      - name: Set xcode version (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Set CXX (clang)
        if: matrix.compiler == 'clang'
        run: echo "CXX=clang++" >> $GITHUB_ENV

      # setup-fortran sets CXX=cl, which builds the C++ with MSVC
      - name: Set CXX (Windows intel)
        if: ${{ runner.os == 'Windows' && matrix.compiler == 'intel' }}
        run: echo "CXX=icx" >> $env:GITHUB_ENV

      - name: Show toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun --show-sdk-version
          ld -v 2>&1 | head -2
          $CXX --version | sed -n 1p

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.1
          manifest-path: "${{ env.PROGRAM_NAME }}/pixi.toml"

      # WrapDB, the only source of the meson patch for GoogleTest, can be down,
      # so download it once for each change to the wraps and retry when the cache is empty
      - name: Cache subproject downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.PROGRAM_NAME }}/subprojects/packagecache
          key: subprojects-${{ runner.os }}-${{ hashFiles(format('{0}/subprojects/*.wrap', env.PROGRAM_NAME)) }}

      - name: Download subprojects
        shell: bash
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          for attempt in 1 2 3; do
            pixi run -- meson subprojects download && exit 0
            [ $attempt -lt 3 ] && sleep 60
          done
          exit 1

      - name: Set ostag
        shell: bash
        working-directory: ${{ env.PROGRAM_NAME }}
        id: ostag
        run: |
          echo "ostag=$(pixi run get-ostag)" >> $GITHUB_ENV
    
      - name: Create source zip file on Linux
        if: ${{ matrix.release == 'yes' && runner.os == 'Linux' }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          zip -r ${{ env.PROGRAM_NAME }}_source.zip meson.build meson.options version.txt subprojects/*.wrap scripts/ src/ test/
          ls -lha *.zip

      # static link gfortran libs
      - name: Hide dylibs (macOS gcc)
        if: ${{ runner.os == 'macOS' && matrix.compiler == 'gcc' }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          version=${{ matrix.version }}
          brew_prefix="$(brew --prefix)"
          libpath="$brew_prefix/opt/gcc@$version/lib/gcc/$version"
          mv $libpath/libgcc_s.1.1.dylib $libpath/libgcc_s.1.1.dylib.bak
          mv $libpath/libgfortran.5.dylib $libpath/libgfortran.5.dylib.bak 
          mv $libpath/libquadmath.0.dylib $libpath/libquadmath.0.dylib.bak
          mv $libpath/libstdc++.6.dylib $libpath/libstdc++.6.dylib.bak

      # keep the release running on macOS 14 and, with gcc, static link libgcc;
      # the linker warns that the Homebrew libstdc++.a was built for macOS 15
      - name: Set LDFLAGS (macOS)
        if: runner.os == 'macOS'
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "LDFLAGS=$LDFLAGS -static-libgcc" >> $GITHUB_ENV
          fi
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV

      # the Linux executable does not need the C++ library of the computer it
      # runs on; libgcc stays shared, since the static libgcc of GCC 12 and
      # later needs glibc 2.35
      - name: Set LDFLAGS (Linux)
        if: runner.os == 'Linux'
        run: echo "LDFLAGS=$LDFLAGS -static-libstdc++" >> $GITHUB_ENV

      - name: Build ${{ env.PROGRAM_NAME }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          pixi run setup
          pixi run build

      - name: Check libraries (Linux)
        working-directory: ${{ env.PROGRAM_NAME }}/bin
        if: runner.os == 'Linux'
        run: |
          readelf -d gridgen | grep NEEDED
          if readelf -d gridgen | grep NEEDED | grep 'libstdc++'; then
            echo "error: gridgen dynamically links the C++ library"
            exit 1
          fi
          if objdump -T gridgen | grep -E 'GLIBCXX_|CXXABI_'; then
            echo "error: gridgen needs symbols of a shared C++ library"
            exit 1
          fi
          newest=$(objdump -T gridgen | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc version needed: $newest, by:"
          objdump -T gridgen | grep -w "$newest"

      - name: Check architecture (macOS)
        working-directory: ${{ env.PROGRAM_NAME }}/bin
        if: runner.os == 'macOS'
        run: |
          otool -L gridgen
          if otool -L gridgen | grep -E 'libgfortran|libgcc_s|libquadmath|libstdc\+\+'; then
            echo "error: gridgen dynamically links gcc runtime libraries"
            exit 1
          fi
          minos=$(otool -l gridgen | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/&&!d{print $2; d=1}')
          echo "minimum macOS version: $minos"
          if [[ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ]]; then
            echo "error: gridgen requires macOS $minos, not $MACOSX_DEPLOYMENT_TARGET"
            exit 1
          fi
          lipo -info gridgen

      # the release must not need the Intel or Visual C++ runtime DLLs
      - name: Check DLLs (Windows intel)
        if: ${{ runner.os == 'Windows' && matrix.compiler == 'intel' }}
        working-directory: ${{ env.PROGRAM_NAME }}/bin
        run: |
          $dlls = dumpbin /dependents gridgen.exe | Select-String -Pattern '^\s+(\S+\.dll)$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          $dlls
          if (-not $dlls) {
            echo "error: dumpbin listed no DLLs for gridgen.exe"
            exit 1
          }
          $other = $dlls | Where-Object { $_ -notmatch '^(kernel32|user32|advapi32|shell32|ole32|oleaut32|ws2_32|bcrypt|ntdll|api-ms-win-.*)\.dll$' }
          if ($other) {
            echo "error: gridgen.exe needs DLLs that are not part of Windows: $($other -join ', ')"
            exit 1
          }

      - name: Show build log
        if: failure()
        working-directory: ${{ env.PROGRAM_NAME }}
        run: cat builddir/meson-logs/meson-log.txt
      
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.compiler}}-${{ matrix.version }}-meson-log.txt
          path: ${{ env.PROGRAM_NAME }}/builddir/meson-logs/meson-log.txt
    
      - name: Test ${{ env.PROGRAM_NAME }}
        if: success()
        working-directory: ${{ env.PROGRAM_NAME }}
        run: pixi run test

      # outputs are compared with the base branch on pull requests only; add the
      # output-change label to a pull request that changes output intentionally
      - name: Checkout ${{ env.PROGRAM_NAME }} base branch for output comparison
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'output-change') }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.base_ref }}
          path: ${{ env.PROGRAM_NAME }}-main

      - name: Build ${{ env.PROGRAM_NAME }} base branch
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'output-change') }}
        working-directory: ${{ env.PROGRAM_NAME }}
        shell: bash
        run: |
          # reuse the downloads of this branch when the base branch has the same
          # wraps; meson stops on a cached file whose hash differs from its wrap
          if cmp -s <(cat subprojects/*.wrap) <(cat ../${{ env.PROGRAM_NAME }}-main/subprojects/*.wrap); then
            cp -R subprojects/packagecache ../${{ env.PROGRAM_NAME }}-main/subprojects/
          fi
          pixi run setup-main
          pixi run build-main

      - name: Compare outputs with ${{ env.PROGRAM_NAME }} base branch
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'output-change') }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: pixi run compare-main

      - name: Create zip file on MacOS and Linux
        if: ${{ matrix.release == 'yes' && runner.os != 'Windows' }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          zip -r -j ${ostag}.zip bin/
          ls -lha *.zip

      - name: Create zip file on Windows
        if: ${{ matrix.release == 'yes' && runner.os == 'Windows' }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          $ZipFileName = "$env:ostag.zip"
          Compress-Archive -Path "bin\*" -DestinationPath $ZipFileName
          ls *.zip

      - name: Upload distribution archive
        if: matrix.release == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIST }}-${{ matrix.os }}
          path: ${{ env.PROGRAM_NAME }}/*.zip

  sanitize:
    name: ubuntu-22.04 gcc 13 sanitizers
    if: ${{ !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || github.event.label.name == 'output-change' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout ${{ env.PROGRAM_NAME }}
        uses: actions/checkout@v5
        with:
          path: ${{ env.PROGRAM_NAME }}

      - name: Setup gcc 13
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 13

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.1
          manifest-path: "${{ env.PROGRAM_NAME }}/pixi.toml"

      # WrapDB, the only source of the meson patch for GoogleTest, can be down,
      # so download it once for each change to the wraps and retry when the cache is empty
      - name: Cache subproject downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.PROGRAM_NAME }}/subprojects/packagecache
          key: subprojects-${{ runner.os }}-${{ hashFiles(format('{0}/subprojects/*.wrap', env.PROGRAM_NAME)) }}

      - name: Download subprojects
        shell: bash
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          for attempt in 1 2 3; do
            pixi run -- meson subprojects download && exit 0
            [ $attempt -lt 3 ] && sleep 60
          done
          exit 1

      - name: Test ${{ env.PROGRAM_NAME }} with the sanitizers
        working-directory: ${{ env.PROGRAM_NAME }}
        run: pixi run sanitize

  release_notes:
    name: Release notes
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-notes.yml

  release:
    name: Make release
    needs: [build, release_notes]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          path: ${{ env.PROGRAM_NAME }}
          # the changelog reads the commits since the previous release tag
          fetch-depth: 0

      - name: Read the version number from version.txt
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          version=$(cat version.txt)
          # a development version cannot be released
          if [[ "$version" == *dev* ]]; then
            echo "version.txt has development version $version; run pixi run update-version --releasemode first"
            exit 1
          fi
          echo "PROGRAM_VERSION=$version" >> $GITHUB_ENV

      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.DIST }}*
          merge-multiple: true
          path: ${{ env.DIST }} 

      - name: List distribution files
        run: ls -l ${{ env.DIST }} 

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.1
          manifest-path: "${{ env.PROGRAM_NAME }}/pixi.toml"

      - name: Write the changelog
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          # a release made again finds its tag already in place
          if git rev-parse -q --verify "refs/tags/v$PROGRAM_VERSION" > /dev/null; then
            pixi run git cliff --latest --strip all --output changelog.md
          else
            pixi run changelog --output changelog.md
          fi
          cat changelog.md

        # create new release if manual trigger
      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.PROGRAM_VERSION }}
          name: "${{ env.PROGRAM_NAME }} executables"
          bodyFile: ${{ env.PROGRAM_NAME }}/changelog.md
          artifacts: "${{ env.DIST }}/*"
          draft: false
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
