name: gridgen models
on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'meson.build'
      - 'meson.options'
      - 'test/check_models*'
      - 'test/action01_buildqtg.dfn'
      - 'test/shapefiles/**'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.github/workflows/check-models.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PIXI_BETA_WARNING_OFF: true
jobs:
  check-models:
    name: MODFLOW-USG and MODFLOW 6 on gridgen output
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout gridgen
        uses: actions/checkout@v5

      # g++ from conda-forge (the gcc pixi environment)
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.1
          environments: gcc models

      # WrapDB, the only source of the meson patch for GoogleTest, can be down,
      # so download it once for each change to the wraps and retry when the cache is empty
      - name: Cache subproject downloads
        uses: actions/cache@v6
        with:
          path: subprojects/packagecache
          key: subprojects-${{ runner.os }}-${{ hashFiles('subprojects/*.wrap') }}

      - name: Download subprojects
        run: |
          for attempt in 1 2 3; do
            pixi run -e gcc -- meson subprojects download && exit 0
            [ $attempt -lt 3 ] && sleep 60
          done
          exit 1

      - name: Build gridgen
        run: |
          pixi run -e gcc setup
          pixi run -e gcc build

      # get-modflow installs the latest release of each program; the token
      # raises the GitHub API rate limit
      - name: Run MODFLOW-USG and MODFLOW 6 on gridgen output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pixi run check-models

      - name: Upload the MODFLOW listing files
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-models-listing-files
          path: |
            test/check_models/**/*.lst
            test/check_models/**/*.list
