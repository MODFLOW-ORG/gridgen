name: gridgen release notes
on:
  push:
    paths:
      - 'doc/ReleaseNotes/**'
      - '.github/workflows/release-notes.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'doc/ReleaseNotes/**'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:
  # called by the release job in ci.yml
  workflow_call:
jobs:
  build:
    name: Build release notes
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout gridgen
        uses: actions/checkout@v5
        with:
          path: gridgen

      - name: Checkout usgslatex
        uses: actions/checkout@v5
        with:
          repository: MODFLOW-ORG/usgslatex
          path: usgslatex

      # the packages the release notes read (latexmk -recorder) and the programs
      # that build them; the installation in ~/texlive is cached
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            latex-bin bibtex latexmk
            amsfonts amsmath atbegshi atveryend bigintcalc bitset caption cm
            cm-super cmap dvips ec eepic enumitem epstopdf-pkg eso-pic
            etoolbox fancybox fancyhdr fontname geometry gettitlestring graphics
            graphics-cfg graphics-def hycolor hyperref iftex infwarerr intcalc
            kvdefinekeys kvoptions kvsetkeys latex latexconfig
            ltxcmds mmap mptopdf natbib nextpage pdfescape pdftexcmds
            ragged2e refcount rerunfilecheck setspace stringenc titlesec
            tools ttfutils uniquecounter url wallpaper xcolor

      # TeX Live is in ~/texlive, which the runner owns and sudo would drop
      # from PATH
      - name: Install USGS LaTeX style files and Univers font
        working-directory: usgslatex/usgsLaTeX
        run: ./install.sh --all-users

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # also checks every release note item against the schema
      - name: Generate the History entry for the release in progress
        working-directory: gridgen/doc/ReleaseNotes
        run: python mk_releasenotes.py

      - name: Build release notes
        working-directory: gridgen/doc/ReleaseNotes
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error ReleaseNotes.tex

      # the dist-path prefix matches the release job's artifact pattern in ci.yml
      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: dist-path-release-notes
          path: gridgen/doc/ReleaseNotes/ReleaseNotes.pdf
