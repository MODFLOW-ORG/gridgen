[workspace]
name = "gridgen"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64", "osx-64"]
version = "1.1.00.dev0"

[dependencies]
filelock = "*"
meson = ">=1.3.1"
ninja = "*"
modflow-devtools = "*"
ruff = "*"
codespell = "*"
clang-format = "23.1.*"
gcovr = "*"

[tasks]

# build
clean = { cmd = "rm -rf builddir" }
setup = { cmd = "meson setup --prefix=$(pwd) --bindir=bin -Dunit_tests=enabled builddir", env = { PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig" } }
build = "meson install -C builddir"

# test
test = { cmd = "meson test --verbose --no-rebuild -C builddir" }
test-initial = { cmd = "meson test --verbose --no-rebuild -C builddir initial" }
test-write = { cmd = "meson test --verbose --no-rebuild -C builddir write_data" }
test-shapefile = { cmd = "meson test --verbose --no-rebuild -C builddir shapefileA shapefileB shapefileC shapefileD" }
test-intersect = { cmd = "meson test --verbose --no-rebuild -C builddir intersectA intersectB" }
test-vtk = { cmd = "meson test --verbose --no-rebuild -C builddir vtkA vtkB vtkC" }
test-unit = { cmd = "meson test --verbose --no-rebuild -C builddir unit" }
test-determinism = { cmd = "meson test --verbose --no-rebuild -C builddir determinism" }

# line and function coverage of src/ by the regression cases (shapelib excluded)
coverage = { cmd = "rm -rf builddir-coverage && meson setup -Db_coverage=true -Dunit_tests=disabled --buildtype=debug builddir-coverage && meson compile -C builddir-coverage && meson test -C builddir-coverage determinism && gcovr -r . builddir-coverage --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file -e src/tools/shapefile/shapelib/ -e subprojects/ -e test/ --print-summary -o builddir-coverage/coverage.txt" }

# compare outputs with a build of main checked out at ../gridgen-main
# (e.g., git worktree add ../gridgen-main main)
setup-main = { cmd = "meson setup ../gridgen-main/builddir ../gridgen-main" }
build-main = { cmd = "meson compile -C ../gridgen-main/builddir" }
compare-main = { cmd = "python test/compare_outputs.py --exe builddir/src/gridgen --ref-exe ../gridgen-main/builddir/src/gridgen" }

# release notes (needs TeX Live and the USGS LaTeX class from MODFLOW-ORG/usgslatex)
build-release-notes = { cmd = "python mk_releasenotes.py && latexmk -g -pdf -interaction=nonstopmode -halt-on-error ReleaseNotes.tex", cwd = "doc/ReleaseNotes" }

# version (e.g., pixi run update-version --version 1.0.03 --date 2026-11-15 --releasemode)
update-version = { cmd = "python scripts/update_version.py" }

# style (ruff.toml, .codespellrc, .clang-format)
check-format = { cmd = "ruff format --check . && ruff check . && codespell && python scripts/clang_format.py" }
fix-format = { cmd = "ruff format . && ruff check --fix . && codespell --write-changes && python scripts/clang_format.py --fix" }

# ostag
get-ostag = { cmd = "python -c 'from modflow_devtools.ostags import get_ostag; print(get_ostag())'"} 
